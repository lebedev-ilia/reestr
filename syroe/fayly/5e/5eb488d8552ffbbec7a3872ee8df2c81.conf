server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/console.crt;
    ssl_certificate_key /etc/nginx/ssl/console.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_basic           "Jarvis";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Консоль — пульт управления системой. Без пароля сюда нельзя:
    # через неё можно писать команды от имени Ильи.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Внутренний пароль консоли подставляем здесь, чтобы Илья на телефоне
        # вводил только один пароль — наш, на входе. Файл читается только root.
        include /etc/nginx/console-upstream-auth.conf;

        # Консоль обновляется живьём — нужен апгрейд соединения.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }
}
